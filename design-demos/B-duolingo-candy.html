<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咕嗄声音检测 · 方向 B · Duolingo 糖果风</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --green:#58CC02; --green-d:#46A302; --green-s:#EAFBD8;
  --blue:#1CB0F6;  --blue-d:#1899D6;  --blue-s:#DDF4FF;
  --yellow:#FFC800;--yellow-d:#E0AF00;--yellow-s:#FFF6D6;
  --orange:#FF9600;--orange-d:#E08600;--orange-s:#FFEED2;
  --red:#FF4B4B;   --red-d:#E03F3F;   --red-s:#FFDFE0;
  --ink:#3C3C3C; --ink2:#8A8A8A; --ink3:#B9B9B9;
  --line:#EDEDED; --soft:#F7F7F7; --white:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:#EFEFEF;
  font-family:'Baloo 2','Nunito','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  color:var(--ink); padding:34px 22px 70px;
  -webkit-font-smoothing:antialiased;
}
.stage-head{max-width:1200px;margin:0 auto 34px;text-align:center;}
.stage-head h1{font-size:23px;font-weight:800;margin:0 0 7px;letter-spacing:.2px;}
.stage-head .sub{font-size:13px;color:var(--ink2);font-style:italic;margin:0;}
.stage-head .tags{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.stage-head .tags span{font-size:11px;font-weight:700;padding:4px 11px;border-radius:999px;background:#fff;color:#7A7A7A;box-shadow:0 2px 0 #E0E0E0;}
.stage{display:flex;flex-wrap:wrap;gap:48px 40px;justify-content:center;align-items:flex-start;max-width:1900px;margin:0 auto;}
.phone-wrap{width:432px;}
.phone-cap{font-style:italic;font-size:12.5px;color:#8C8C8C;text-align:center;margin-bottom:11px;letter-spacing:.2px;}
.device{width:432px;background:#1a1a1a;padding:10px;border-radius:44px;box-shadow:0 0 0 2px #2a2a2a,0 20px 60px rgba(0,0,0,.3);}
.screen{position:relative;width:412px;height:892px;background:#fff;border-radius:36px;overflow:hidden;}

/* ---------- status bar ---------- */
.statusbar{position:absolute;top:0;left:0;right:0;height:32px;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;font-size:12.5px;font-weight:800;color:#141414;z-index:30;letter-spacing:.2px;}
.sb-notch{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:#0b0b0b;}
.sb-icons{display:flex;align-items:center;gap:5px;}
.sb-icons svg{display:block;}

/* ---------- content ---------- */
.content{position:absolute;top:32px;left:0;right:0;bottom:24px;display:flex;flex-direction:column;background:#fff;}
.app-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:11px 14px 4px;}
.app-body::-webkit-scrollbar{width:0;height:0;}

/* ---------- bottom nav ---------- */
.app-nav{flex:0 0 66px;display:flex;align-items:center;gap:6px;padding:0 14px 6px;border-top:1.5px solid var(--line);background:#fff;}
.navitem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  padding:6px 0 5px;border-radius:16px;color:#BFBFBF;cursor:pointer;user-select:none;transition:background .16s,color .16s;}
.navitem span{font-size:11px;font-weight:800;letter-spacing:.3px;}
.navitem.active{color:var(--green);background:var(--green-s);}
.navitem:active{transform:scale(.96);}

.gesture{position:absolute;left:50%;bottom:11px;transform:translateX(-50%);width:100px;height:4px;border-radius:2px;background:#121212;opacity:.7;}

/* ---------- shared bits ---------- */
.card{background:#fff;border:2px solid var(--line);border-radius:22px;}
.btn3d{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;border:none;cursor:pointer;
  font-family:inherit;font-weight:800;font-size:17px;letter-spacing:.4px;color:#fff;background:var(--green);
  border-radius:18px;padding:15px 18px;box-shadow:0 4px 0 var(--green-d);
  transition:transform .07s ease,box-shadow .07s ease;user-select:none;}
.btn3d:active{transform:translateY(4px);box-shadow:0 0 0 0 rgba(0,0,0,0);}
.btn3d .pen{flex:0 0 auto;margin-top:-2px;}
.btn3d.alt{background:var(--blue);box-shadow:0 4px 0 var(--blue-d);}

/* ---------- detect page ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;}
.brand{display:flex;align-items:center;gap:9px;}
.brand-ava{width:38px;height:38px;border-radius:13px;background:var(--green-s);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.brand-name{font-size:16.5px;font-weight:800;line-height:1.1;letter-spacing:.2px;}
.brand-sub{font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.5px;}
.livepill{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:6px 11px;border-radius:999px;
  background:var(--red-s);color:var(--red);white-space:nowrap;}
.livepill.off{background:#F0F0F0;color:#A0A0A0;}
.livepill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.2s infinite;}
.livepill.off .dot{animation:none;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}

.locbar{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#6E6E6E;
  background:var(--soft);border-radius:12px;padding:7px 11px;margin-bottom:11px;}
.locbar svg{flex:0 0 auto;}

.gaugecard{padding:8px 10px 12px;margin-bottom:10px;}
.gaugewrap{position:relative;width:200px;height:200px;margin:0 auto;}
.gaugewrap svg{display:block;width:200px;height:200px;}
.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.gauge-db{display:flex;align-items:baseline;gap:3px;line-height:1;}
.gauge-db b{font-size:44px;font-weight:800;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;}
.gauge-db i{font-style:normal;font-size:15px;font-weight:800;color:var(--ink3);}
.levelpill{margin-top:9px;font-size:12.5px;font-weight:800;color:#fff;padding:4px 14px;border-radius:999px;letter-spacing:1px;
  box-shadow:0 3px 0 rgba(0,0,0,.13);}

.bubble{display:flex;align-items:center;gap:10px;background:var(--green-s);border-radius:20px;padding:9px 13px 9px 10px;margin-bottom:11px;}
.bubble-pen{flex:0 0 auto;width:42px;height:46px;display:flex;align-items:center;justify-content:center;}
.bubble-k{font-size:10.5px;font-weight:800;color:var(--green-d);letter-spacing:.6px;}
.bubble-m{font-size:13.5px;font-weight:800;color:#3E6B14;line-height:1.25;margin-top:1px;}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px;}
.stat{border-radius:18px;padding:8px 12px 9px;display:flex;flex-direction:column;gap:1px;}
.stat b{font-size:21px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
.stat b i{font-style:normal;font-size:11px;font-weight:800;margin-left:2px;}
.stat span{font-size:10.5px;font-weight:800;letter-spacing:.4px;}
.stat .bar{height:5px;border-radius:3px;background:rgba(0,0,0,.08);margin-top:5px;overflow:hidden;}
.stat .bar i{display:block;height:100%;border-radius:3px;}

.wavecard{padding:10px 12px 9px;margin-bottom:11px;}
.card-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px;}
.card-head b{font-size:12.5px;font-weight:800;letter-spacing:.3px;}
.card-head span{font-size:10.5px;font-weight:700;color:var(--ink3);}

/* ---------- history list ---------- */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;margin:2px 0 10px;}
.pagehead h2{font-size:21px;font-weight:800;margin:0;letter-spacing:.2px;}
.pagehead .cnt{font-size:11.5px;font-weight:800;color:var(--green-d);background:var(--green-s);padding:4px 10px;border-radius:999px;}
.sumstrip{display:flex;gap:8px;margin-bottom:12px;}
.sumstrip div{flex:1;background:var(--soft);border-radius:14px;padding:7px 9px;}
.sumstrip b{display:block;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;}
.sumstrip span{font-size:10px;font-weight:700;color:var(--ink2);}

.hcard{display:flex;gap:11px;align-items:stretch;border:2px solid var(--line);border-radius:20px;padding:10px 11px;margin-bottom:9px;
  cursor:pointer;transition:transform .1s ease,border-color .15s ease,box-shadow .15s ease;background:#fff;}
.hcard:hover{border-color:#DFDFDF;box-shadow:0 5px 0 #EFEFEF;}
.hcard:active{transform:translateY(3px);box-shadow:none;}
.hbadge{flex:0 0 52px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;font-weight:800;line-height:1;}
.hbadge b{font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:-.5px;}
.hbadge i{font-style:normal;font-size:9px;font-weight:800;opacity:.85;margin-top:2px;}
.hmain{flex:1;min-width:0;}
.htop{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.hplace{font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hpeak{font-size:10.5px;font-weight:800;white-space:nowrap;color:var(--ink2);}
.hmeta{font-size:10.5px;font-weight:700;color:var(--ink2);margin:2px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hwave{height:30px;}
.harrow{display:flex;align-items:center;color:#CFCFCF;}

/* ---------- detail ---------- */
.dtop{display:flex;align-items:center;gap:11px;margin:2px 0 10px;}
.iconbtn{width:38px;height:38px;flex:0 0 38px;border-radius:13px;background:var(--soft);display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:none;padding:0;color:var(--ink);transition:transform .07s;}
.iconbtn:active{transform:scale(.94);}
.dtop h2{font-size:18px;font-weight:800;margin:0;flex:1;}
.hero{border-radius:22px;padding:12px 16px;color:#fff;margin-bottom:10px;position:relative;overflow:hidden;}
.hero .hplace2{font-size:20px;font-weight:800;letter-spacing:.2px;}
.hero .hrange{font-size:11.5px;font-weight:700;opacity:.92;margin-top:3px;}
.hero .htags{display:flex;gap:7px;margin-top:9px;}
.hero .htags span{font-size:11px;font-weight:800;background:rgba(255,255,255,.24);padding:4px 10px;border-radius:999px;}
.hero-pen{position:absolute;right:12px;bottom:-6px;opacity:.9;}

.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px;}
.dcell{border-radius:16px;padding:7px 11px;background:var(--soft);}
.dcell b{display:block;font-size:19px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;}
.dcell b i{font-style:normal;font-size:10.5px;color:var(--ink3);font-weight:800;margin-left:2px;}
.dcell span{font-size:10.5px;font-weight:700;color:var(--ink2);}

.axis{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--ink3);margin-top:5px;}

.infolist{border:2px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:10px;}
.inforow{display:flex;align-items:center;justify-content:space-between;padding:8px 13px;border-bottom:1.5px solid var(--line);font-size:12.5px;}
.inforow:last-child{border-bottom:none;}
.inforow .k{font-weight:700;color:var(--ink2);}
.inforow .v{font-weight:800;font-variant-numeric:tabular-nums;}

/* ---------- empty state ---------- */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px 24px;height:100%;}
.empty .epen{margin-bottom:8px;}
.empty h3{font-size:18px;font-weight:800;margin:0 0 6px;}
.empty p{font-size:12.5px;font-weight:700;color:var(--ink2);margin:0 0 18px;line-height:1.5;max-width:250px;}
.empty .btn3d{width:auto;padding:13px 22px;font-size:15px;}

/* ---------- about ---------- */
.about{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:8px;}
.about .logo{width:132px;height:132px;border-radius:44px;background:var(--green-s);display:flex;align-items:center;justify-content:center;margin-bottom:13px;}
.about h2{font-size:24px;font-weight:800;margin:0;letter-spacing:.3px;}
.about .en{font-size:12px;font-weight:800;color:var(--ink3);letter-spacing:1.4px;margin-top:2px;}
.verpill{margin-top:10px;font-size:12px;font-weight:800;color:#fff;background:var(--green);padding:5px 14px;border-radius:999px;box-shadow:0 3px 0 var(--green-d);}
.desc{font-size:12.5px;font-weight:700;color:#6E6E6E;line-height:1.75;margin:15px 4px 15px;text-align:left;background:var(--soft);border-radius:18px;padding:13px 15px;}
.about .infolist{width:100%;text-align:left;}
.gh{width:100%;}
.gh .ghurl{font-size:11px;font-weight:800;opacity:.9;letter-spacing:.1px;}
.foot{font-size:10.5px;font-weight:700;color:var(--ink3);margin-top:14px;line-height:1.6;}

/* ---------- penguin ---------- */
.peng{display:block;}
</style>
</head>
<body>

<div class="stage-head">
  <h1>咕嗄声音检测 GugaNoiseDetector · 设计方向 B</h1>
  <p class="sub">现实参照迁移：Duolingo 设计语言（糖果高饱和 + 超粗圆体 + 3D 凸起按钮 + 吉祥物到处出没）</p>
  <div class="tags"><span>单 accent：咕嗄绿 #58CC02</span><span>Baloo 2 / Nunito 900 圆体</span><span>box-shadow:0 4px 0 硬底按钮</span><span>6 台可交互真机框</span></div>
</div>

<div class="stage" id="stage"></div>

<script>
/* =========================================================
   咕嗄声音检测 · 方向 B · Duolingo Candy
   单文件原生 JS 迷你状态机，file:// 直接打开
   ========================================================= */

/* ---------------- utils ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function fx(n,d){return Number(n).toFixed(d===undefined?1:d);}

/* 等级阈值：安静 <45 / 正常 45-60 / 嘈杂 60-80 / 震耳 >=80 */
var LEVELS=[
  {max:45 ,name:'安静',c:'#58CC02',d:'#46A302',s:'#EAFBD8',tip:'今天环境很安静，棒！'},
  {max:60 ,name:'正常',c:'#1CB0F6',d:'#1899D6',s:'#DDF4FF',tip:'刚刚好，继续保持～'},
  {max:80 ,name:'嘈杂',c:'#FF9600',d:'#E08600',s:'#FFEED2',tip:'有点吵，可以戴上耳塞'},
  {max:999,name:'震耳',c:'#FF4B4B',d:'#E03F3F',s:'#FFDFE0',tip:'太吵啦！注意保护听力'}
];
function lvOf(db){for(var i=0;i<LEVELS.length;i++){if(db<LEVELS[i].max)return LEVELS[i];}return LEVELS[3];}

/* ---------------- 原创扁平企鹅「咕嗄」 ---------------- */
function peng(size,opt){
  opt=opt||{};
  var hp=opt.hp!==false;
  var s=size, h=Math.round(size*1.15);
  return '<svg class="peng" width="'+s+'" height="'+h+'" viewBox="0 0 120 138" fill="none" xmlns="http://www.w3.org/2000/svg">'
    +'<rect x="33" y="118" width="25" height="15" rx="7.5" fill="#FF9F1C"/>'
    +'<rect x="62" y="118" width="25" height="15" rx="7.5" fill="#FF9F1C"/>'
    +'<ellipse cx="60" cy="72" rx="45" ry="50" fill="#3B3B3B"/>'
    +'<ellipse cx="34" cy="74" rx="10" ry="24" fill="#2E2E2E"/>'
    +'<ellipse cx="86" cy="74" rx="10" ry="24" fill="#2E2E2E"/>'
    +'<ellipse cx="60" cy="90" rx="29" ry="31" fill="#FFFFFF"/>'
    +'<ellipse cx="60" cy="53" rx="31" ry="29" fill="#FFFFFF"/>'
    +'<circle cx="47" cy="51" r="6.6" fill="#2B2B2B"/>'
    +'<circle cx="73" cy="51" r="6.6" fill="#2B2B2B"/>'
    +'<circle cx="49.4" cy="48.3" r="2.3" fill="#FFFFFF"/>'
    +'<circle cx="75.4" cy="48.3" r="2.3" fill="#FFFFFF"/>'
    +'<path d="M60 57 C66.5 57 71 61.4 71 66.4 C71 71 66.5 75 60 75 C53.5 75 49 71 49 66.4 C49 61.4 53.5 57 60 57 Z" fill="#FF9F1C"/>'
    +(hp
      ? '<path d="M16 66 A44 44 0 0 1 104 66" stroke="#1CB0F6" stroke-width="7" stroke-linecap="round"/>'
        +'<rect x="5" y="54" width="22" height="27" rx="11" fill="#1CB0F6"/>'
        +'<rect x="93" y="54" width="22" height="27" rx="11" fill="#1CB0F6"/>'
      : '')
    +'</svg>';
}

/* ---------------- 圆形仪表 ---------------- */
var G={cx:120,cy:118,r:82,a0:135,sweep:270};
function gp(r,a){var t=a*Math.PI/180;return [G.cx+r*Math.cos(t),G.cy+r*Math.sin(t)];}
function arcD(r,a1,a2){
  var p1=gp(r,a1),p2=gp(r,a2);
  var large=(a2-a1)>180?1:0;
  return 'M'+fx(p1[0],2)+' '+fx(p1[1],2)+' A'+r+' '+r+' 0 '+large+' 1 '+fx(p2[0],2)+' '+fx(p2[1],2);
}
function dbToAngle(db){return G.a0+G.sweep*clamp((db-30)/60,0,1);}

function gaugeHTML(db){
  var L=lvOf(db), i, d, a, p1, p2, isMajor, r1, r2, c;
  var ticks='', labels='';
  for(d=30; d<=90; d+=5){
    a=dbToAngle(d); isMajor=(d%10===0);
    r1=G.r+9; r2=isMajor?G.r+19:G.r+14;
    p1=gp(r1,a); p2=gp(r2,a);
    c=lvOf(d===90?89:d).c;
    ticks+='<line x1="'+fx(p1[0])+'" y1="'+fx(p1[1])+'" x2="'+fx(p2[0])+'" y2="'+fx(p2[1])+'" stroke="'+c
      +'" stroke-width="'+(isMajor?3.2:2.2)+'" stroke-linecap="round" opacity="'+(isMajor?1:.5)+'"/>';
  }
  for(d=30; d<=90; d+=10){
    a=dbToAngle(d); p1=gp(G.r+32,a);
    labels+='<text x="'+fx(p1[0])+'" y="'+fx(p1[1]+4)+'" text-anchor="middle" font-size="12" font-weight="800" fill="#C2C2C2">'+d+'</text>';
  }
  var f=clamp((db-30)/60,0,1);
  var na=dbToAngle(db);
  var track=arcD(G.r,G.a0,G.a0+G.sweep);
  return '<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">'
    +'<path d="'+track+'" fill="none" stroke="#F0F0F0" stroke-width="14" stroke-linecap="round"/>'
    +'<path class="g-prog" d="'+track+'" fill="none" stroke="'+L.c+'" stroke-width="14" stroke-linecap="round" pathLength="100" '
      +'stroke-dasharray="'+fx(f*100,2)+' 100" style="transition:stroke-dasharray .55s cubic-bezier(.34,1.3,.64,1),stroke .3s"/>'
    +ticks+labels
    +'<g class="g-needle" style="transform-origin:120px 118px;transform:rotate('+fx(na-270)+'deg);'
      +'transition:transform .55s cubic-bezier(.34,1.3,.64,1)">'
      +'<line x1="120" y1="118" x2="120" y2="'+(118-(G.r-10))+'" stroke="#3C3C3C" stroke-width="5" stroke-linecap="round"/>'
      +'<circle cx="120" cy="'+(118-(G.r-10))+'" r="5.4" fill="'+L.c+'" stroke="#FFFFFF" stroke-width="2.4"/>'
    +'</g>'
    +'<circle cx="120" cy="118" r="8.5" fill="#3C3C3C"/><circle cx="120" cy="118" r="3.6" fill="#FFFFFF"/>'
    +'</svg>';
}
function updateGauge(wrap,db){
  var L=lvOf(db), f=clamp((db-30)/60,0,1), na=dbToAngle(db);
  var prog=wrap.querySelector('.g-prog');
  if(prog){prog.setAttribute('stroke',L.c);prog.setAttribute('stroke-dasharray',fx(f*100,2)+' 100');}
  var nd=wrap.querySelector('.g-needle');
  if(nd){
    nd.style.transform='rotate('+fx(na-270)+'deg)';
    var tip=nd.querySelector('circle');
    if(tip) tip.setAttribute('fill',L.c);
  }
}

/* ---------------- 波形 ---------------- */
var uid=0;
function smoothPath(pts){
  var d='M'+fx(pts[0][0])+' '+fx(pts[0][1]);
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||pts[i+1];
    var c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    var c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=' C'+fx(c1x)+' '+fx(c1y)+' '+fx(c2x)+' '+fx(c2y)+' '+fx(p2[0])+' '+fx(p2[1]);
  }
  return d;
}
function waveSVG(vals,color,w,h,opt){
  opt=opt||{};
  var lo=(opt.lo===undefined)?24:opt.lo, hi=(opt.hi===undefined)?96:opt.hi;
  var n=vals.length, i;
  var pts=[];
  for(i=0;i<n;i++){
    pts.push([i*(w/(n-1)), h-((clamp(vals[i],lo,hi)-lo)/(hi-lo))*h]);
  }
  var line=smoothPath(pts);
  var area=line+' L'+w+' '+h+' L0 '+h+' Z';
  var gid='wg'+(uid++);
  var grid='';
  if(opt.grid){
    for(i=0;i<opt.grid.length;i++){
      var gy=fx(h-((opt.grid[i]-lo)/(hi-lo))*h);
      grid+='<line x1="0" y1="'+gy+'" x2="'+w+'" y2="'+gy+'" stroke="#E9E9E9" stroke-width="1" stroke-dasharray="4 5"/>';
    }
  }
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" style="display:block">'
    +'<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0" stop-color="'+color+'" stop-opacity=".30"/>'
      +'<stop offset="1" stop-color="'+color+'" stop-opacity=".03"/></linearGradient></defs>'
    +grid
    +'<path d="'+area+'" fill="url(#'+gid+')"/>'
    +'<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="'+(opt.sw||2.6)
      +'" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
    +'</svg>';
}
/* 由会话记录生成平滑波形（确定性，刷新不变） */
function waveFor(rec,n){
  n=n||64;
  var r=mulberry32(rec.seed*7919+13), out=[], i, t, v;
  var mid=(rec.min+rec.max)/2, amp=(rec.max-rec.min)/2;
  for(i=0;i<n;i++){
    t=i/(n-1);
    v=mid
      +amp*0.58*Math.sin(t*Math.PI*2*1.7+rec.seed)
      +amp*0.26*Math.sin(t*Math.PI*2*4.6+rec.seed*2.3)
      +amp*0.34*(r()-0.5);
    out.push(clamp(v,rec.min,rec.max));
  }
  return out;
}

      +'</div></div>';
    frag.appendChild(wrap);

    var screenEl=wrap.querySelector('.screen');
    screenEl._state={
      tab:cfg.tab,
      running:!!cfg.running,
      db:cfg.db||42.3,
      selected:(cfg.selected===undefined?null:cfg.selected),
      empty:!!cfg.empty,
      emptyDefault:!!cfg.empty
    };
    render(screenEl);

    /* 事件委托：底部 tab / 主按钮 / 列表项 / 返回 / 去检测 / GitHub */
    (function(el){
      el.querySelector('.content').addEventListener('click',function(e){
        var s=el._state;
        var t;
        if((t=e.target.closest('.navitem'))){
          var tab=t.getAttribute('data-tab');
          if(tab!==s.tab){
            s.tab=tab;
            if(tab==='history') s.selected=null;   /* 切回历史 tab 总是回到列表 */
            render(el);
          } else if(tab==='history'){
            s.selected=null; render(el);
          }
          return;
        }
        if(e.target.closest('.js-toggle')){ s.running=!s.running; render(el); return; }
        if((t=e.target.closest('.hcard'))){ s.selected=parseInt(t.getAttribute('data-id'),10); render(el); return; }
        if(e.target.closest('.js-back')){ s.selected=null; render(el); return; }
        if((t=e.target.closest('.js-go'))){ s.tab='detect'; s.running=true; render(el); return; }
        if(e.target.closest('.js-gh')){
          var b=e.target.closest('.js-gh');
          var old=b.querySelector('.ghurl').textContent;
          b.querySelector('.ghurl').textContent='github.com/cloudea/GugaNoiseDetector';
          b.style.background='var(--blue)'; b.style.boxShadow='0 4px 0 var(--blue-d)';
          setTimeout(function(){b.style.background='';b.style.boxShadow='';},420);
          return;
        }
      });
    })(screenEl);
  }
  stage.appendChild(frag);

  /* 全局心跳：仅驱动“运行中”的检测屏 */
  var screens=stage.querySelectorAll('.screen');
  setInterval(function(){
    for(var k=0;k<screens.length;k++){ refreshLive(screens[k]); }
  },420);
})();
</script>
</body>
</html>
